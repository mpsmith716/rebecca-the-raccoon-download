html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2e2140; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; font-family: 'Chewy', sans-serif; }
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#game { display: block; touch-action: none; }

body.touch.roam #touch-ui { display: block; }
#safe-probe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#stick-zone { position: fixed; left: 0; bottom: 0; width: 45vw; height: 65vh; z-index: 10; touch-action: none; }
#stick-base { position: absolute; left: max(22px, 4vw, calc(env(safe-area-inset-left) + 12px)); bottom: max(22px, 6vh, calc(env(safe-area-inset-bottom) + 12px)); width: min(36vmin, 180px); height: min(36vmin, 180px); border-radius: 50%; background: rgba(255,246,224,.35); border: 4px solid rgba(46,33,64,.6); }
#stick-knob { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%; border-radius: 50%; background: #fff6e0; border: 4px solid #2e2140; box-shadow: 0 4px 0 rgba(46,33,64,.35); }
#act-btn { position: fixed; right: max(24px, 4vw, calc(env(safe-area-inset-right) + 12px)); bottom: max(26px, 7vh, calc(env(safe-area-inset-bottom) + 12px)); z-index: 10; width: min(30vmin, 150px); height: min(30vmin, 150px); border-radius: 50%; border: 5px solid #2e2140; background: radial-gradient(circle at 40% 35%, #ffd0e6, #ff86bd); color: #2e2140; font-family: 'Chewy', sans-serif; font-size: min(7vmin, 34px); box-shadow: 0 6px 0 rgba(46,33,64,.4); touch-action: none; padding: 0; }
#act-btn.on { transform: translateY(4px); box-shadow: 0 2px 0 rgba(46,33,64,.4); }

<div id="wrap"><canvas id="game" aria-label="Rebecca the Raccoon game"></canvas></div>
<script>
/* Grown-Ups Shop: catalog + entitlements. NO real payments in this build.
   Loaded in the browser (window.Store) and by node tests (module.exports).

   Billing is behind a tiny adapter interface so Google Play Billing (via a Capacitor plugin) can be dropped in later:
     adapter.name                       -> string ('test' here; e.g. 'play' later)
     adapter.testMode                   -> true only for the local stub (the UI then says "Test mode, no real charge")
     adapter.purchase(product)          -> Promise<{ ok: bool, cancelled?: bool, token?: string }>
     adapter.restore()                  -> Promise<string[]>  product ids the store says this account owns
   A Play adapter would call the plugin's purchase/queryPurchases, verify + acknowledge, then resolve the same shapes.
   Nothing here touches the network; the test adapter grants locally and stores entitlements in localStorage.

   Rules kept by design: coins are never sold, nothing random is sold, no ads, no timers. */
(function (global) {
  'use strict';
  var KEY = 'rebecca-raccoon.store.v1';
  // kind: world | season | cosmetic | bundle | pass.  grants: entitlement ids this product unlocks (besides itself).
  var CATALOG = [
    { id: 'world.grove', kind: 'world', title: 'Glimmer Grove', price: '$3.99', desc: 'A glowing crystal forest.', icon: 'grove' },
    { id: 'world.hollow', kind: 'world', title: 'Storybook Hollow', price: '', desc: 'Comes free with Rebecca books.', icon: 'hollow', bookOnly: true },
    { id: 'world.shore', kind: 'world', title: 'Seashell Shore', price: '', desc: 'Beaches and tide pools.', icon: 'shore', soon: true },
    { id: 'world.peak', kind: 'world', title: 'Snowcap Peak', price: '', desc: 'Snowy hills to explore.', icon: 'peak', soon: true },
    { id: 'pack.harvest', kind: 'season', title: 'Harvest Festival', price: '', desc: 'Apples, hay bales, a scarecrow.', icon: 'harvest', soon: true, months: [9, 10, 11], placeholder: true },
    { id: 'pack.spring', kind: 'season', title: 'Spring Blossom', price: '', desc: 'Blossoms, birds and puddles.', icon: 'spring', soon: true, months: [3, 4, 5], placeholder: true },
    { id: 'pack.spooky', kind: 'season', months: [10], title: 'Spooky Hollow', price: '$1.99', desc: 'Witch outfit + 3 spooky decor.', icon: 'spooky' },
    { id: 'pack.winter', kind: 'season', months: [12, 1, 2], title: 'Winter Cozy', price: '$1.99', desc: 'Winter outfit + 3 cozy decor.', icon: 'winter' },
    { id: 'outfit.safari', kind: 'cosmetic', title: 'Safari Outfit', price: '$0.99', desc: 'Safari shirt and sun hat.', icon: 'safari' },
    { id: 'outfit.pajamas', kind: 'cosmetic', title: 'Starry Pajamas', price: '$0.99', desc: 'Pajamas and a nightcap.', icon: 'pajamas' },
    { id: 'set.starry', kind: 'cosmetic', title: 'Starry Night Set', price: '$1.49', desc: 'Starry bed, lamp and rug.', icon: 'starry' },
    { id: 'bundle.everything', kind: 'bundle', title: 'Everything Bundle', price: '$6.99', desc: 'Every world and pack.', icon: 'everything', grants: ['world.grove', 'pack.spooky', 'pack.winter', 'outfit.safari', 'outfit.pajamas', 'set.starry'] },
    { id: 'pass.monthly', kind: 'pass', title: 'Monthly Pass', price: '$2.99/mo', desc: 'Treehouse Pass: unlocks everything.', icon: 'pass', all: true },
    { id: 'pass.yearly', kind: 'pass', title: 'Yearly Pass', price: '$19.99/yr', desc: 'Treehouse Pass: unlocks everything.', icon: 'pass', all: true }
  ];
  var BY = {}; CATALOG.forEach(function (p) { BY[p.id] = p; });
  function cents(p) { var m = /\$(\d+)\.(\d\d)/.exec(p.price || ''); return m ? +m[1] * 100 + +m[2] : 0; }
  function bundleSavings() { var b = BY['bundle.everything'], sum = b.grants.reduce(function (a, id) { return a + cents(BY[id]); }, 0); return { sum: sum, price: cents(b), pct: Math.round((1 - cents(b) / sum) * 100) }; }

  var TestAdapter = { name: 'test', testMode: true,
    purchase: function (p) { return Promise.resolve({ ok: true, token: 'test-' + p.id }); },
    restore: function () { return Promise.resolve(null); } }; // null = "nothing from a server", keep local

  function create(opts) {
    opts = opts || {}; var storage = opts.storage || null, adapter = opts.adapter || TestAdapter, owned = {}, listeners = [];
    try { var raw = storage && storage.getItem(KEY), o = raw && JSON.parse(raw); if (o && Array.isArray(o.owned)) o.owned.forEach(function (id) { if (BY[id] && !BY[id].soon) owned[id] = true; }); } catch (e) {}
    function persist() { try { if (storage) storage.setItem(KEY, JSON.stringify({ v: 1, owned: Object.keys(owned) })); } catch (e) {} }
    function changed() { persist(); listeners.forEach(function (f) { try { f(); } catch (e) {} }); }
    function hasPass() { return !!(owned['pass.monthly'] || owned['pass.yearly']); }
    // owns(entitlement): directly bought, granted by a bundle, or covered by the pass
    function owns(id) { var p = BY[id]; if (!p || p.soon || p.bookOnly) return false; /* book worlds unlock in-game via the book hunt, never sold or bundled */ if (owned[id]) return true; if (hasPass()) return true;
      return Object.keys(owned).some(function (k) { var g = BY[k].grants; return g && g.indexOf(id) >= 0; }); }
    function status(id) { var p = BY[id]; if (!p) return 'none'; if (p.bookOnly) return 'book'; if (p.soon) return 'soon'; return owns(id) ? 'owned' : 'buy'; }
    function purchase(id) { var p = BY[id]; if (!p) return Promise.resolve({ status: 'unknown' }); if (p.soon) return Promise.resolve({ status: 'soon' }); if (p.bookOnly) return Promise.resolve({ status: 'book' }); if (owns(id)) return Promise.resolve({ status: 'owned' });
      return adapter.purchase(p).then(function (r) { if (!r || !r.ok) return { status: r && r.cancelled ? 'cancelled' : 'failed' }; owned[id] = true; changed(); return { status: 'granted', id: id }; },
        function () { return { status: 'failed' }; }); }
    function restore() { return adapter.restore().then(function (ids) { if (Array.isArray(ids)) { ids.forEach(function (id) { if (BY[id] && !BY[id].soon) owned[id] = true; }); changed(); } return Object.keys(owned); }); }
    function reset() { owned = {}; changed(); } // test-mode helper (Grown-Ups Shop: "Reset test purchases")
