<script>
/* Pure game rules: treasure hunts (riddle -> clues -> dig), daily riddle, collection, save/load.
   No DOM. Loaded in the browser (window.Logic) and by node tests (module.exports). */
(function (global) {
  'use strict';
  var T = 40; // tile size in world px
  var SAVE_KEY = 'rebecca-raccoon.save.v1';
  var MODES = ['guided', 'independent', 'master'];

  var TREASURES = {
    acorn: {
      id: 'acorn', name: 'Golden Acorn', stone: { x: 1560, y: 640 },
      riddle: ['Three clues the forest keeps for you:', 'a paw on wood where the bridge leads through,', 'a ring of caps where red tops grow,', 'a crooked stump with pebbles in a row.'],
      clues: [
        { id: 'paw', x: 2260, y: 470, kind: 'log', name: 'Carved Log', text: ['A paw print carved in the old log!', 'Its toes point east, toward the red mushrooms.'] },
        { id: 'ribbon', x: 2700, y: 800, kind: 'ring', name: 'Mushroom Ring', text: ['A pink ribbon tied in the mushroom ring.', 'A tiny note says: "Go south to the crooked stump."'] },
        { id: 'pebbles', x: 2560, y: 1280, kind: 'stump', name: 'Crooked Stump', text: ['Pebbles make an arrow on the crooked stump.', 'That was the last clue! Read the final riddle.'] }
      ],
      finalRiddle: ['Where the old tree with a heart looks down', 'on the stones that hop the stream,', 'dig in the soft brown ground.'],
      dig: { x: 1790, y: 1470, r: 46 },
      hints: [
        ['Mossy stones hold riddles. Try the woods past the village.', 'Follow the path east into Whispering Woods.', 'The mossy riddle stone is just inside the woods.'],
        ['Find the bridge over the stream first.', 'The bridge is north. Look for a log just across it.', 'The carved log is right past the east end of the bridge.'],
        ['Red-topped mushrooms grow where the woods open up.', 'Head east from the carved log.', 'The mushroom ring is far east, in a sunny clearing.'],
        ['A crooked stump is somewhere south.', 'Walk south from the mushroom ring.', 'The stump is south-west of the mushroom ring, east of the stream.'],
        ['Think about the final riddle. Which stones hop the stream?', 'Find the stepping stones and the tree with a heart.', 'Cross the stepping stones west. Dig beside the heart tree.']
      ]
    }
  };

  function newState() {
    return { v: 1, mode: 'guided', pos: { x: 520, y: 760 }, dir: 'down',
      hunts: { acorn: { riddle: false, clues: [], dug: false, placed: false } },
      bag: {}, book: {}, decor: { shelf: null, table: null, sill: null, rug: null },
      day: { key: '', picked: [], dailySolved: false, gifts: {} }, hearts: { hazel: 0, bramble: 0 }, muted: false, seenIntro: false };
  }
  function hunt(state, tid) { var h = state.hunts[tid]; if (!h) h = state.hunts[tid] = { riddle: false, clues: [], dug: false, placed: false }; return h; }

  /* ---- Clue gate ---- */
  function readRiddle(state, tid) { hunt(state, tid).riddle = true; }
  function cluesFound(state, tid) { return hunt(state, tid).clues.length; }
  function nextClueIndex(state, tid) { var h = hunt(state, tid), t = TREASURES[tid]; if (!h.riddle) return -1; for (var i = 0; i < t.clues.length; i++) if (h.clues.indexOf(t.clues[i].id) < 0) return i; return t.clues.length; }
  // A clue can be found only after the riddle is read and every earlier clue is found (a trail).
  function canFindClue(state, tid, clueId) { var t = TREASURES[tid], i = nextClueIndex(state, tid); return i >= 0 && i < t.clues.length && t.clues[i].id === clueId; }
  function findClue(state, tid, clueId) { if (!canFindClue(state, tid, clueId)) return false; hunt(state, tid).clues.push(clueId); return true; }
  // THE gate: nothing about the dig (prompt, sparkle, sound, glow, interaction) exists until this is true.
  function canDig(state, tid, treasures) {
    var t = (treasures || TREASURES)[tid], h = hunt(state, tid);
    if (!t || !h.riddle || h.dug) return false;
    for (var i = 0; i < t.clues.length; i++) if (h.clues.indexOf(t.clues[i].id) < 0) return false;
    return true;
  }
  function dig(state, tid) { if (!canDig(state, tid)) return false; var h = hunt(state, tid); h.dug = true; state.bag.goldenAcorn = 1; return true; }
  function stage(state, tid) { var h = hunt(state, tid); if (!h.riddle) return 0; if (h.dug) return 5; return 1 + h.clues.length; } // 0 riddle,1-3 clue n,4 dig,5 done

  /* ---- Daily (device date) ---- */
  function dateKey(d) { d = d || new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function dayNumber(key) { var p = key.split('-'); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
  function rng(seed) { var s = seed >>> 0 || 1; return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  var DAILY = [
    { q: 'I have a trunk but never pack it. What am I?', a: ['A tree', 'A car', 'A suitcase'], ok: 0 },
    { q: 'I fall in autumn but never get hurt. What am I?', a: ['A rock', 'A leaf', 'A bird'], ok: 1 },
    { q: 'I have wings and spots and love flowers. What am I?', a: ['A ladybug', 'A fish', 'A frog'], ok: 0 },
    { q: 'The more you take, the more you leave behind. What are they?', a: ['Cookies', 'Footsteps', 'Leaves'], ok: 1 },
    { q: 'I run but never walk, and I have a bed but never sleep.', a: ['A river', 'A bunny', 'A clock'], ok: 0 },
    { q: 'I shine at night in the woods, a tiny flying light.', a: ['A moth', 'A firefly', 'A star'], ok: 1 },
    { q: 'I am an oak tree in a tiny hat. What am I?', a: ['A pinecone', 'A seed pod', 'An acorn'], ok: 2 },
    { q: 'What has hands but cannot clap?', a: ['A clock', 'A raccoon', 'A tree'], ok: 0 },
    { q: 'I am full of holes but still hold water.', a: ['A bucket', 'A sponge', 'A net'], ok: 1 },
    { q: 'What gets wetter the more it dries?', a: ['A towel', 'A puddle', 'A cloud'], ok: 0 },
    { q: 'I have a neck but no head, and wear a cap.', a: ['A bottle', 'A mushroom', 'A giraffe'], ok: 0 },
    { q: 'What can you catch but never throw?', a: ['A ball', 'A cold', 'A fish'], ok: 1 }
  ];
  function dailyRiddle(key) { var n = dayNumber(key); return DAILY[((n % DAILY.length) + DAILY.length) % DAILY.length]; }
  function rollDay(state, key) { if (state.day.key !== key) state.day = { key: key, picked: [], dailySolved: false, gifts: {} }; }

  var ITEMS = {
